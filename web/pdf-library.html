<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料管理 · SlopeKG</title><link rel="stylesheet" href="./pages.css?v=20261102-nav3">
<style>.library-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px}.library-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}.library-toolbar input{flex:1;min-width:0;padding:10px;border:1px solid #dbe4df;border-radius:7px}.library-path{display:block;color:#7b8880;margin-top:5px;overflow-wrap:anywhere}.library-run{display:block;padding:14px 0;border-bottom:1px solid #e4e9e5;text-decoration:none}.library-run strong{display:block;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.library-run span{display:block;color:#648473;font-size:12px;margin-top:6px}.library-foot{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.library-dialog{width:min(1100px,94vw);max-width:94vw;border:1px solid #ccdacf;border-radius:12px;padding:20px}.library-dialog::backdrop{background:#203d3860}.library-dialog form{display:flex;justify-content:space-between;align-items:center;gap:16px}.library-dialog h2{font-size:15px;overflow-wrap:anywhere}.library-dialog iframe{display:block;width:100%;height:72vh;border:0}.library-dialog button{cursor:pointer}@media(max-width:950px){.library-layout{grid-template-columns:1fr}.library-toolbar,.library-foot{flex-wrap:wrap}}</style><link rel="stylesheet" href="./navigation.css?v=20261109-ui1"></head>
<body class="portal-body"><main class="page-main"><div class="page-heading"><div><h1>资料管理</h1><p>选择工程资料，查看原文，或进入已有识别任务。</p></div><button class="button" id="libraryUpload">上传 PDF</button><input id="libraryInput" type="file" accept=".pdf,application/pdf" multiple hidden></div>
<p id="libraryStatus" role="status"></p><div class="library-layout"><section class="card"><div class="library-toolbar"><input id="librarySearch" type="search" placeholder="搜索文件名或目录" aria-label="搜索资料"><span id="libraryCount" class="section-subtitle">读取中…</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>选择</th><th>资料名称</th><th>大小</th><th>原文</th></tr></thead><tbody id="libraryRows"></tbody></table></div><div class="library-foot"><span class="section-subtitle">上传后自动建立本地基础索引；智能识别需单独启动。</span><button id="identifySelected" class="button" disabled>选择资料后开始识别</button></div></section>
<aside class="card"><h2>已有识别任务</h2><p class="section-subtitle">打开保存结果，继续核对证据和评估。</p><div id="libraryRuns"></div></aside></div></main>
<dialog id="libraryPreview" class="library-dialog"><form method="dialog"><h2 id="libraryPreviewTitle">原文预览</h2><button class="button secondary">关闭预览</button></form><iframe id="libraryPdf" title="PDF原文预览"></iframe></dialog>
<script src="./navigation.js?v=20261109-ui1"></script><script src="./api.js?v=20261028"></script><script src="./library.js?v=20261109"></script></body></html>
