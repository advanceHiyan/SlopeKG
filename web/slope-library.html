<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>边坡资料库 - SlopeKG</title><link rel="stylesheet" href="./pages.css"><link rel="stylesheet" href="./navigation.css"><link rel="stylesheet" href="./slope-library.css"></head>
<body class="portal-body"><header class="site-header"></header><main class="page-main library-main">
<div class="page-heading"><div><p class="eyebrow">资料整理</p><h1>边坡资料库</h1><p>识别结果先保存 → 核对是哪一处边坡 → 关联永久边坡身份。不同批次分别保留。</p></div><a class="button" href="./pdf-ingestion.html?new=1">＋ 识别新资料</a></div>
<section id="intake" class="card" hidden></section><p id="message" role="status"></p>
<div class="library-summary" id="counts"></div><p id="libraryState" class="library-warning"></p>
<div class="library-layout"><aside class="card library-list"><div class="library-filters"><input id="search" type="search" placeholder="搜索边坡名称、编号或桩号" aria-label="搜索边坡"><select id="filter" aria-label="档案筛选"><option value="all">边坡主档</option><option value="unassigned">待核对资料（尚未建立归属）</option><option value="pending">历史待核对主档</option></select></div><div id="rows" aria-label="边坡档案列表"></div></aside>
<section id="detail" class="card library-detail" aria-live="polite"><div class="library-empty"><h2>选择一处边坡</h2><p>查看来源文件、识别候选、原页和归属核对记录。</p></div></section></div>
<p class="small muted"><a href="./slopes.html">查看既有边坡字段档案</a> · 风险识别将在资料归属核对后从边坡档案取用证据。</p>
</main>
<dialog id="bindDialog"><form id="bindForm"><h2>核对资料归属</h2><p id="bindSource"></p><div id="identitySource" class="identity-box"></div><div id="identityMatches"></div>
<label>处理方式 / 归入边坡<select id="bindTarget" required></select></label><div id="identityDifferences"></div>
<section id="newIdentityFields" hidden><label id="newNameLabel">新边坡名称<input id="newName" maxlength="250"></label><p class="small muted">确认确为新边坡后才分配永久 ID。以下资料可暂缺，外部编号与所属范围须同时填写。</p><div id="newIdentityInputs" class="identity-grid"></div><label class="confirm"><input id="distinctConfirmed" type="checkbox">若存在相似主档，已核对这是另一处边坡。</label><label>不同边坡的区分依据<input id="distinctReason" maxlength="2000"></label></section>
<section id="conflictControls" class="library-warning" hidden><label class="confirm"><input id="conflictConfirmed" type="checkbox">已核对上述身份冲突，仍确认此归属。</label><label>冲突处理依据<textarea id="conflictReason" maxlength="2000" placeholder="说明哪个身份表述有误，以及对应原页依据"></textarea></label></section>
<label class="confirm"><input id="includeRelated" type="checkbox" checked>同时归入本来源边坡中有明确父子关系的对象，保留各自范围。</label><label>核对人<input id="actor" required maxlength="100" autocomplete="name"></label><label>归属依据<textarea id="reason" required maxlength="4000" placeholder="例如：原件中的路线、桩号范围、左右侧及边坡编号一致"></textarea></label><label class="confirm"><input id="confirm" type="checkbox" required>已对照原页，确认本次归属处理。此操作不确认字段值或风险等级。</label><p id="bindError" role="alert"></p><div class="action-row"><button id="cancel" type="button" class="button secondary">取消</button><button id="saveBinding" type="submit" class="button">保存归属</button></div></form></dialog>
<dialog id="identityDialog"><form id="identityForm"><h2>维护边坡唯一身份</h2><p id="identityId" class="small"></p><label>边坡名称<input id="identityName" required maxlength="250"></label><div id="masterIdentityInputs" class="identity-grid"></div><p class="small muted">系统 ID 永久不变。外部编号在“所属范围”内唯一，修改后旧编号仍保留为本边坡历史编号。</p><label>核对人<input id="identityActor" required maxlength="100"></label><label>身份依据<textarea id="identityReason" required maxlength="4000"></textarea></label><label class="confirm"><input id="identityConfirmed" type="checkbox" required>已核对边坡身份信息。此操作不确认工程参数。</label><p id="identityError" role="alert"></p><div class="action-row"><button id="cancelIdentity" type="button" class="button secondary">取消</button><button type="submit" class="button">保存身份</button></div></form></dialog>
<dialog id="evidenceDialog"><button id="closeEvidence" class="button secondary">关闭原页</button><a id="fullEvidence" target="_blank" rel="noopener">打开完整原页</a><img id="evidenceImage" alt="归档 PDF 原页"><p id="evidenceQuote"></p></dialog>
<script src="./navigation.js"></script><script src="./api.js"></script><script src="./slope-library.js"></script></body></html>
