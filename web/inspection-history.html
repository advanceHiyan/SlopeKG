<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>历史巡查检索 - SlopeKG</title><link rel="stylesheet" href="./pages.css"/>
<style>.history-controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end}.history-controls label{display:grid;gap:6px}.history-controls input,.history-controls select{padding:9px;border:1px solid #ced8df;border-radius:6px}.history-controls button,.history-toolbar button{padding:9px 14px;border:1px solid #bdd0d8;border-radius:6px;background:#fff;color:#164c50;cursor:pointer}.history-controls button{background:#164c50;color:#fff}button:disabled{opacity:.45;cursor:default}.history-table{table-layout:fixed;min-width:850px}.history-table th:nth-child(1){width:18%}.history-table th:nth-child(2){width:22%}.history-table th:nth-child(3){width:30%}.history-table th:nth-child(4){width:30%}#historyRows td{vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}#historyRows details{margin-top:8px}#historyRows summary{cursor:pointer;color:#126d79}.history-summary{margin:18px 0}.history-controls input[type=search]{min-width:220px}.history-toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0}.history-source{font-size:12px;word-break:break-all}#historyError{color:#9d2929}</style>
</head><body class="portal-body"><header class="site-header"><div class="site-header-inner"><a class="site-brand" href="./index.html">SlopeKG<small>公路边坡风险知识图谱</small></a><nav class="site-nav"><a href="./index.html">总览</a><a href="./slopes.html">边坡档案</a><a href="./data-status.html">数据与接口</a><a class="active" href="./inspection-history.html">历史巡查</a></nav></div></header>
<main class="page-main"><div class="page-heading"><div><h1>历史巡查检索</h1><p>按日期、对象和病害原文查找历史记录，定位到原表核对。</p></div><a id="historySource" hidden>下载核验后的原表</a></div>
<div id="historyBoundary" class="notice">历史记录不代表近期状态；路线与具体边坡对应尚未提供。</div><p id="historySummary" class="history-summary"></p><p id="historyError" role="alert" hidden></p>
<section class="card"><form id="historyFilters" class="history-controls"><label>对象<select id="historyType"><option value="边坡">边坡</option><option value="桥梁">桥梁</option><option value="all">全部</option></select></label><label>开始日期<input id="historyStart" type="date"/></label><label>结束日期<input id="historyEnd" type="date"/></label><label>桩号、病害、方向或桥名<input id="historyQuery" type="search" maxlength="200" placeholder="例如：水毁、K340、下行"/></label><label>含日期缺失记录（不按日期筛选）<input id="historyUndated" type="checkbox" checked/></label><button id="historySearch" type="submit">检索</button></form>
<div class="history-toolbar"><button id="historyPrevious" type="button" disabled>上一页</button><button id="historyNext" type="button" disabled>下一页</button><span id="historyCount" role="status"></span></div>
<div class="table-wrap"><table class="data-table history-table"><thead><tr><th>日期 / 对象</th><th>桩号 / 方向</th><th>问题原文</th><th>原表位置 / 其他原始字段</th></tr></thead><tbody id="historyRows"></tbody></table></div></section>
</main><script src="./api.js"></script><script src="./inspection-history.js"></script></body></html>
