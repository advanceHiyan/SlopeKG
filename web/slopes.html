<p>静态资料和近期与业务数据分别显示已有项数。历史报告中的防护设计可在档案中查看，设施现状按观测记录核对。</p>
<p class="notice info" id="dossierRecognitionHint" hidden>请选择同一处边坡，再点「关联识别资料」。识别任务会预先选中。</p>
<div class="filters"><input id="slopeSearch" type="search" placeholder="搜索桩号、编号、来源名称"/><select id="slopeDataFilter" aria-label="按资料缺项筛选"><option value="all">全部档案</option><option value="static">静态资料有缺项</option><option value="operational">近期与业务数据有缺项</option></select></div>
