<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SlopeKG 风险研判离线版</title>
  <style>
    :root{--bg:#f3f6f6;--panel:#fff;--ink:#172229;--muted:#65747a;--line:#d9e1e1;--brand:#143f40;--accent:#0b796d;--soft:#eaf6f3;--warn:#94651c;--warnbg:#fff7e3;--danger:#a53c49;--dangerbg:#fff0f2;--p1:#b63848;--p2:#d6812c;--p3:#34847a;--p4:#7c8990;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;color:var(--ink)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input,select{font:inherit}.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #102c2c33}.topin{max-width:1500px;margin:auto;padding:15px 24px;display:flex;align-items:center;gap:24px}.brand{font-size:20px;font-weight:800}.brand small{display:block;color:#b9d5d1;font-size:11px;font-weight:400;margin-top:2px}.exportmeta{margin-left:auto;text-align:right;color:#c6d9d6;font-size:11px}.main{max-width:1500px;margin:auto;padding:24px}.offline{border:1px solid #a9cfc8;background:#edf9f6;color:#275e58;padding:10px 13px;border-radius:8px;margin-bottom:16px;font-size:13px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin:5px 0 18px}.heading h1{font-size:27px;margin:0}.heading p{color:var(--muted);margin:6px 0 0;line-height:1.55}.btn{height:38px;border:0;border-radius:7px;padding:0 13px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}.grid{display:grid;gap:15px}.metrics{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:17px;box-shadow:0 2px 8px #263d3e0a}.metric strong{display:block;font-size:28px}.metric span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.metric.p1 strong{color:var(--p1)}.metric.p2 strong{color:var(--p2)}.metric.p3 strong{color:var(--p3)}.metric.p4 strong{color:var(--p4)}.notice{border:1px solid #e5c67d;background:var(--warnbg);color:#6e4b13;padding:11px 13px;border-radius:7px;line-height:1.55;font-size:13px;margin-bottom:15px}.notice.danger{border-color:#e5aeb6;background:var(--dangerbg);color:var(--danger)}.distribution{display:flex;height:13px;border-radius:99px;overflow:hidden;background:#e8eeee;margin-top:9px}.distribution i{display:block;min-width:0}.distribution .p1{background:var(--p1)}.distribution .p2{background:var(--p2)}.distribution .p3{background:var(--p3)}.distribution .p4{background:var(--p4)}.layout{display:grid;grid-template-columns:minmax(650px,1.15fr) minmax(390px,.85fr);gap:15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{height:38px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 10px}.toolbar input{min-width:300px;flex:1}.tablewrap{max-height:760px;overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}.table th{position:sticky;top:0;background:#f7fafa;color:var(--muted);z-index:2}.table tbody tr{cursor:pointer}.table tbody tr:hover,.table tbody tr.selected{background:var(--soft)}.sub{display:block;color:var(--muted);font-size:11px;margin-top:3px}.priority{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;color:#fff}.priority.p1{background:var(--p1)}.priority.p2{background:var(--p2)}.priority.p3{background:var(--p3)}.priority.p4{background:var(--p4)}.detail{max-height:840px;overflow:auto}.titleline{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.titleline h2{font-size:19px;margin:0}.detail h3{font-size:14px;margin:17px 0 8px}.callout{border-left:4px solid var(--accent);background:var(--soft);padding:12px 14px;border-radius:7px;margin:13px 0}.callout h3{margin:0 0 6px}.callout p{font-size:12px;line-height:1.55;margin:5px 0}.callout li{margin:7px 0;font-size:12px}.row{border-bottom:1px solid var(--line);padding:8px 0;line-height:1.5}.row:last-child{border:0}.row small{display:block;color:var(--muted);margin-bottom:3px}.basis{border-left:3px solid #aacdc8;background:#f8fbfb;padding:9px 11px;margin:8px 0;font-size:12px;line-height:1.55}.basis strong,.basis span,.basis small{display:block}.basis small{color:var(--muted)}.evidence{border:1px solid #ead49c;background:#fffaf0;border-radius:7px;padding:9px;margin:7px 0 0;font-size:12px;line-height:1.55}.evidence small{color:var(--warn)}.actions,.limits,.boundary ul{padding-left:21px;line-height:1.6;font-size:13px}.gaps{display:grid;gap:8px}.gap{border:1px solid var(--line);border-radius:7px;padding:10px;font-size:12px;line-height:1.55}.gap span{display:inline-block;color:var(--warn);margin-left:5px}.gap p{margin:5px 0}.gap small{display:block;color:var(--muted)}details summary{cursor:pointer;color:var(--accent);font-weight:700;margin:14px 0}.boundary{grid-template-columns:1fr 1fr;margin-top:15px}.boundary h2{font-size:17px;margin:0}.yes h2{color:var(--accent)}.no h2{color:var(--danger)}.empty{color:var(--muted);text-align:center;padding:28px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 0 8px}
    @media(max-width:1050px){.metrics{grid-template-columns:repeat(3,1fr)}.layout,.boundary{grid-template-columns:1fr}.detail{max-height:none}.exportmeta{display:none}}@media(max-width:650px){.main{padding:14px}.topin{padding:13px 14px}.heading{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:repeat(2,1fr)}.toolbar input{min-width:100%}.tablewrap{max-height:620px}.card{padding:13px}}@media print{.top,.offline,.toolbar,.heading .btn{display:none!important}.main{max-width:none;padding:0}.card{box-shadow:none}.layout,.boundary{grid-template-columns:1fr}.tablewrap,.detail{max-height:none;overflow:visible}.layout>article{display:none}.detail{page-break-before:auto}}
  </style>
</head>
<body>
  <header class="top"><div class="topin"><div class="brand">SlopeKG<small>公路边坡宏观风险筛查与现场复核排序</small></div><div class="exportmeta" id="exportMeta"></div></div></header>
  <main class="main">
    <div class="offline">本页面为单文件离线成果，风险筛查结果、证据和交互程序均已嵌入 HTML；无需联网、无需安装软件、无需启动后台服务。</div>
    <div class="heading"><div><h1>风险研判离线版</h1><p>分别展示静态易发性关注、近期动态状态和暴露后果；P1–P4 只表示人工复核顺序。</p></div><button class="btn" onclick="window.print()">打印 / 另存为 PDF</button></div>
    <section id="metrics" class="grid metrics"></section>
    <section class="card" style="margin-bottom:15px"><strong>复核优先级分布</strong><div id="distribution" class="distribution"></div><span id="distributionText" class="sub"></span></section>
    <div class="notice">当前结论是基于既有工程资料的宏观筛查，不预测具体失稳时间，不输出滑坡概率，也不作“一定安全”或“一定失稳”的判断。<span id="validationStatus" class="sub"></span></div>
    <section class="layout">
      <article class="card"><div class="toolbar"><input id="search" type="search" placeholder="检索路线、桩号、灾害类型"/><select id="priority"><option value="">全部优先级</option><option value="P1">P1 优先复核</option><option value="P2">P2 重点复核</option><option value="P3">P3 常规复核</option><option value="P4">P4 资料补录</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>优先级</th><th>边坡</th><th>灾害资料</th><th>静态关注</th><th>近期动态</th><th>信息具备</th></tr></thead><tbody id="rows"></tbody></table></div></article>
      <aside id="detail" class="card detail"><div class="empty">请选择一个边坡。</div></aside>
    </section>
    <section id="boundary" class="grid boundary"></section>
    <div class="footer">SlopeKG 风险研判单文件离线成果 · 生成时间以页面顶部为准</div>
  </main>
  <script id="slopekg-risk-data" type="application/json">__SLOPEKG_RISK_DATA__</script>
  <script>
  (()=>{
    "use strict";
    const D=JSON.parse(document.getElementById("slopekg-risk-data").textContent),R=D.risk||{},rows=R.assessments||[],summary=R.summary||{},counts=summary.priority_counts||{};
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const uniq=a=>[...new Set((a||[]).filter(Boolean))];
    let selected=rows[0]?.slope_id||null;
    document.getElementById("exportMeta").innerHTML=`导出：${esc(D.export?.generated_at||"")}<br/>数据：${esc(R.generated_at||"")}`;
    const metric=(code,label)=>`<div class="card metric ${code.toLowerCase()}"><strong>${esc(counts[code]||0)}</strong><span>${code} ${label}</span></div>`;
    document.getElementById("metrics").innerHTML=[metric("P1","优先复核"),metric("P2","重点复核"),metric("P3","常规复核"),metric("P4","资料补录"),`<div class="card metric"><strong>${esc(summary.with_current_dynamic_evidence||0)}</strong><span>有近期动态证据</span></div>`].join("");
    const V=D.evaluation||{};document.getElementById("validationStatus").textContent=V.status==="evaluated_against_independent_labels"?`独立专家样本已评测${V.evaluated||0}个；重点对象召回率${V.metrics?.urgent_recall_p1_p2??"—"}。`:"当前没有独立专家风险金标准，不能报告风险判断准确率。";
    const total=rows.length||1,parts=["P1","P2","P3","P4"];
    document.getElementById("distribution").innerHTML=parts.map(k=>`<i class="${k.toLowerCase()}" style="width:${Number(counts[k]||0)/total*100}%"></i>`).join("");
    document.getElementById("distributionText").textContent=parts.map(k=>`${k} ${counts[k]||0}个`).join(" · ");
    const search=document.getElementById("search"),priority=document.getElementById("priority"),body=document.getElementById("rows");
    function visible(){const q=search.value.trim().toLowerCase(),p=priority.value;return rows.filter(r=>(!p||r.screening_priority_code===p)&&(!q||[r.slope_label,r.business_id,r.route_code,r.station,...(r.hazard_types||[]),...(r.hazard_body_types||[])].join(" ").toLowerCase().includes(q)))}
    function renderRows(){const data=visible();body.innerHTML=data.length?data.map(r=>`<tr data-id="${esc(r.slope_id)}" class="${selected===r.slope_id?"selected":""}"><td><span class="priority ${esc(r.screening_priority_code.toLowerCase())}">${esc(r.screening_priority_code)}</span><span class="sub">${esc(r.screening_priority)}</span></td><td><strong>${esc(r.business_id||r.slope_label)}</strong><span class="sub">${esc(r.slope_label)}</span></td><td>${esc(uniq([...(r.hazard_types||[]),...(r.hazard_body_types||[])]).join("、")||"未明确")}</td><td>${esc(r.static_susceptibility?.level||"资料不足")}<span class="sub">${esc(r.stability_concern||"稳定性无法判断")}</span></td><td>${esc(r.dynamic_alert?.level||"无法判断")}</td><td><strong>${esc(r.risk_data_inventory?.available_categories??"—")}/${esc(r.risk_data_inventory?.total_categories??"—")} 类</strong><span class="sub">首轮建议补 ${esc(r.risk_data_inventory?.first_round_recommended??0)} 类</span></td></tr>`).join(""):'<tr><td colspan="6" class="empty">没有符合条件的边坡。</td></tr>';body.querySelectorAll("[data-id]").forEach(n=>n.onclick=()=>{selected=n.dataset.id;renderRows();renderDetail(rows.find(r=>r.slope_id===selected))})}
    function renderDetail(r){
      const target=document.getElementById("detail");if(!r){target.innerHTML='<div class="empty">未找到筛查结果。</div>';return}
      const basisWarning=r.screening_basis_status?.minimum_basis_met===false?'<div class="notice danger">当前只有自动识别的候选灾害标签，尚无可核验的灾害文字或独立工程信息；应先补录基础资料，不能据此判断风险高低。</div>':"";
      const gaps=r.critical_data_gaps||[],inv=r.risk_data_inventory||{},top=gaps.slice(0,5),gate=r.formal_risk_gate||{},calculation=r.stability_calculation_readiness||{};
      const basis=(r.basis||[]).map(x=>`<div class="basis"><strong>${esc(x.label)}</strong><span>${esc(x.value)}</span><small>${esc(x.interpretation||"")}</small>${x.evidence?`<div class="evidence">${esc(x.evidence.text||"已定位证据")}<small>${esc(x.evidence.source_file||"")} · PDF第${esc(x.evidence.page||"?")}页</small></div>`:""}${x.boundary?`<small>${esc(x.boundary)}</small>`:""}</div>`).join("")||'<div class="empty">暂无足够的命中依据。</div>';
      const scenarios=(r.stability_scenarios||[]).map(x=>`<tr><td>${esc(x.condition)}</td><td>${x.fs==null?"—":esc(x.fs)}</td><td>${esc(x.status||"未判定")}</td><td>${esc(x.review_note||"历史报告，时效待核")}</td></tr>`).join("");
      const profiles=(r.hazard_profiles||[]).map(x=>`<div class="basis"><strong>${esc(x.hazard_type)}</strong><span>${x.missing_key_inputs?.length?`关键输入待补：${esc(x.missing_key_inputs.join("、"))}`:"现有关键输入已覆盖"}</span><small>${esc(x.boundary||"")}</small></div>`).join("");
      const conflicts=(r.data_conflicts||[]).map(x=>`<div class="notice danger"><strong>${esc(x.scenario)}稳定性资料待核对</strong><br/>Fs：${esc((x.fs_values||[]).join("、")||"—")}；状态：${esc((x.statuses||[]).join("、")||"—")}。${esc(x.handling||"")}</div>`).join("");
      const formalText=r.formal_risk_level?`正式风险等级：${esc(r.formal_risk_level)}`:r.provisional_risk_matrix_level?`正式风险等级暂无法确定；参考矩阵为“${esc(r.provisional_risk_matrix_level)}”，但尚未通过发布门槛。`:"正式风险等级暂无法确定；当前只给出分项关注和人工复核顺序。";
      target.innerHTML=`<div class="titleline"><div><h2>${esc(r.slope_label)}</h2><span class="sub">${esc(r.business_id||"")}</span></div><span class="priority ${esc(r.screening_priority_code.toLowerCase())}">${esc(r.screening_priority_code)} ${esc(r.screening_priority)}</span></div><div class="notice" style="margin-top:13px">${formalText}</div>${basisWarning}${conflicts}<div class="callout"><h3>建议优先补充的数据</h3><p>共定义 <strong>${esc(inv.total_categories??18)}</strong> 类研判信息，当前具备 <strong>${esc(inv.available_categories??"—")}</strong> 类；首轮建议补充以下项目。</p><ol>${top.map(x=>`<li><strong>${esc(x.label||x.code)}</strong>：${esc(x.collection_hint||"")}</li>`).join("")||"<li>当前未列出优先补充项。</li>"}</ol></div><div class="row"><small>静态易发性关注</small>${esc(r.static_susceptibility?.level||"资料不足")}<span class="sub">${esc(r.static_susceptibility?.interpretation||"")}</span></div><div class="row"><small>近期动态状态</small>${esc(r.dynamic_alert?.level||"无法判断")}<span class="sub">${esc(r.dynamic_alert?.interpretation||"")}</span></div><div class="row"><small>暴露后果</small>${esc(r.consequence_assessment?.level||"无法判断")}<span class="sub">${esc(r.consequence_assessment?.interpretation||"")}</span></div><div class="row"><small>数据时效</small>${esc(r.temporal_validity?.label||"无带日期的近期数据")}<span class="sub">${esc(r.temporal_validity?.observed_at||"未提供日期")} · ${esc(r.temporal_validity?.policy||"")}</span></div><div class="row"><small>稳定性关注</small>${esc(r.stability_concern)}</div><div class="row"><small>证据置信度</small>${esc(r.confidence)}（定性，不是概率）</div><div class="row"><small>复核理由</small>${esc((r.screening_reasons||[]).join("；"))}</div><h3>分灾种检查</h3>${profiles}<details><summary>稳定性程序化计算：${calculation.ready?"输入已具备，待审核运行":`尚缺${(calculation.blocking_items||[]).length}项硬条件`}</summary><p class="sub">${esc(calculation.boundary||"")}</p><ul class="limits">${Object.entries(calculation.checks||{}).map(([code,passed])=>`<li>${passed?"✓":"✗"} ${esc(code)}</li>`).join("")}</ul></details><details><summary>正式结论门槛：${gate.ready?"已满足，仍需审核":`尚缺${(gate.blocking_items||[]).length}项`}</summary><p class="sub">${esc(gate.message||"")}</p><ul class="limits">${Object.entries(gate.checks||{}).map(([code,passed])=>`<li>${passed?"✓":"✗"} ${esc(code)}</li>`).join("")}</ul></details><h3>命中依据与原文证据</h3>${basis}${scenarios?`<h3>稳定性工况</h3><div class="tablewrap" style="max-height:300px"><table class="table"><thead><tr><th>工况</th><th>Fs</th><th>原报告结论</th><th>时效边界</th></tr></thead><tbody>${scenarios}</tbody></table></div>`:""}<h3>建议动作</h3><ol class="actions">${(r.recommended_action||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol><details><summary>查看全部 ${gaps.length} 项缺失数据及采集方法</summary><div class="gaps">${gaps.map(x=>`<div class="gap"><strong>${esc(x.label||x.code)}</strong><span>${esc(x.improvement_priority_label||"基础补录")}</span><p>${esc(x.why_it_matters||"")}</p><small>建议补采：${esc(x.collection_hint||"从资料或现场补录，并保留来源和时间。")}</small>${x.interface?`<small>待接接口：${esc(x.interface)}</small>`:""}</div>`).join("")||"<p>未列出。</p>"}</div></details><h3>结论边界</h3><ul class="limits">${(r.limitations||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
    const B=R.boundary||{};document.getElementById("boundary").innerHTML=`<article class="card yes"><h2>当前可以做</h2><ul>${(B.can_do||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></article><article class="card no"><h2>当前不能做</h2><ul>${(B.cannot_do||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></article>`;
    search.oninput=renderRows;priority.onchange=renderRows;renderRows();renderDetail(rows[0]);
  })();
  </script>
</body>
</html>
