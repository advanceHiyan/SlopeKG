<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>规则知识库 - SlopeKG</title><link rel="stylesheet" href="./pages.css?v=20261020-1"/></head>
<body class="portal-body" data-page="rules"><header class="site-header"><div class="site-header-inner"><a class="site-brand" href="./index.html">SlopeKG<small>公路边坡风险知识图谱</small></a><nav class="site-nav"><a href="./index.html">总览</a><a href="./pdf-ingestion.html">PDF解析</a><a href="./slopes.html">边坡档案</a><a href="./graph.html">关系图谱</a><a class="active" href="./rules.html">规则库</a><a href="./data-status.html">数据与接口</a><a href="./risk.html">风险研判</a></nav></div></header>
<main class="page-main"><div class="page-heading"><div><h1>候选风险规则库</h1><p>展示从规范、指南和工程资料自动提取的阈值、条件与证据。候选规则未经审核，不参与正式风险计算。</p></div><span id="rulePublication" class="badge pending">加载中</span></div>
<nav class="subnav"><a class="active" href="./rules.html">规则</a><a href="./formulas.html">公式</a><a href="./rule-sources.html">原始资料</a></nav>
<section class="card manual-rule-card">
  <div class="manual-editor-head"><div class="manual-intro"><span class="manual-intro-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h3"/></svg></span><div><h2>人工规则</h2><p>补充现场经验或已确认的结构化条件，草稿保存后可继续核对。</p></div></div><button id="toggleRuleForm" class="button secondary" type="button" aria-expanded="false" aria-controls="manualRuleForm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新建规则</span></button></div>
  <form id="manualRuleForm" hidden>
    <fieldset class="manual-form-section"><legend>规则信息</legend><p class="manual-section-note">规则用于安排P1—P4复核顺序，不生成正式风险等级。复杂逻辑可登记为说明。</p><div class="manual-rule-meta"><label>规则名称<input name="title" required maxlength="200" placeholder="例如：高陡岩质边坡重点复核"/></label><label>条件组合<select name="match"><option value="all">全部满足（且）</option><option value="any">任一满足（或）</option></select></label><label>输出优先级<select name="priority"><option value="P1">P1 优先复核</option><option value="P2">P2 重点复核</option><option value="P3">P3 常规复核</option><option value="P4">P4 资料补录</option></select></label><label>状态<select name="approval_status"><option value="draft">草稿，不执行</option><option value="approved">审核启用</option><option value="disabled">停用</option></select></label></div></fieldset>
    <fieldset class="manual-form-section"><legend>触发条件</legend><p class="manual-section-note">最多10个条件；选择“已有值”时无需填写比较值。</p>
    <div id="manualRuleConditions" class="manual-rule-conditions"></div>
    <button id="addRuleCondition" class="button ghost small" type="button">＋ 增加条件</button></fieldset>
    <div class="manual-rule-meta"><label>命中原因<input name="reason" maxlength="500" placeholder="显示在风险研判依据中"/></label><label>原始逻辑/限制说明<input name="logic_note" maxlength="4000" placeholder="复杂逻辑可在此登记；不能结构化时不会执行"/></label></div>
    <div class="action-row manual-form-footer"><button class="button" type="submit">保存规则</button><button id="cancelRuleForm" class="button ghost" type="button">收起</button></div>
  </form>
  <p id="manualRuleStatus" class="manual-save-status" role="status" aria-live="polite"></p>
</section>
<section id="ruleMetrics" class="grid metrics-grid"><div class="loading">加载中…</div></section>
<section class="rules-layout"><article class="card"><div class="filters"><input id="ruleSearch" type="search" placeholder="搜索规则、阈值、规范"/><select id="ruleKind"><option value="">全部类型</option></select><select id="ruleStatus"><option value="">全部状态</option><option value="draft">草稿</option><option value="candidate_pending_review">待审核</option><option value="approved">已批准</option><option value="disabled">已停用</option></select></div><div class="table-wrap"><table class="data-table rule-table"><thead><tr><th>规则</th><th>灾害/场景</th><th>来源</th><th>状态</th></tr></thead><tbody id="ruleRows"><tr><td colspan="4">加载中…</td></tr></tbody></table></div></article><aside id="ruleDetail" class="card detail-empty">选择一条规则查看条件、输出和PDF证据。</aside></section></main>
<script src="./api.js?v=20261020-1"></script><script src="./manual-entry.js?v=20261020-1"></script><script src="./rules.js?v=20261020-1"></script></body></html>
