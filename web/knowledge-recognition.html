<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知联 Knowledge - SlopeKG</title><link rel="stylesheet" href="./pages.css?v=20261102-nav3"><link rel="stylesheet" href="./recognition.css?v=20261028"><link rel="stylesheet" href="./knowledge-recognition.css?v=20261028"><link rel="stylesheet" href="./navigation.css?v=20261109-ui1"></head>
<body class="portal-body"><header class="site-header"><div class="site-header-inner"><a class="site-brand" href="./index.html">SlopeKG<small>资料、对象与可追溯知识</small></a><nav class="site-nav"><a class="nav-debug" href="./recognition-debug.html">识别调试</a><a href="./recognition-methods.html">识别方法</a><a href="./graph.html">正式图谱</a></nav></div></header>
<main class="page-main"><nav class="method-nav" aria-label="识别方法"></nav><div class="page-heading"><div><h1>知联 Knowledge</h1><p>先发现全文对象和概念，再关联分散原文，重组为对象事实与关系。与基读 Basic、视读 Visual 分别运行。</p></div><button id="refresh" class="button secondary">刷新</button></div>

<section class="card recognition-card"><h2>选择资料与模型</h2><div class="recognition-controls"><label>模型<select id="model"></select></label><label>调用上限<input id="maxCalls" type="number" min="1" max="10000" value="64"></label><label>模型并发<input id="concurrency" type="number" min="1" max="16" value="6"></label><label>本地OCR补页<input id="ocrPages" type="number" min="0" max="1000" value="0"></label></div>
<p id="endpoint" class="form-help"></p><input id="searchFiles" type="search" placeholder="按文件名或目录筛选" aria-label="筛选资料"><div id="files" class="recognition-files"></div>
<label class="recognition-confirm"><input id="allow" type="checkbox">允许将勾选资料的原文发送到所选模型接口</label><div class="action-row"><button id="prepare" class="button ghost" disabled>仅本地准备</button><button id="run" class="button" disabled>知联 Knowledge</button></div>
<p class="form-help">复用基读表格和已有OCR；补页为0时只复用现有OCR，填正数才运行本地OCR。原文对齐与独立模型复核分开计数；图形缺口保留，结果不自动进入正式图谱。</p><p id="error" class="notice error" hidden role="alert"></p></section>
<section class="card"><h2>任务与覆盖</h2><p id="job" aria-live="polite">尚未开始</p><p id="coverage"></p><div id="metrics" class="grid metrics-grid"></div></section>
<section class="card"><div class="card-title-row"><h2>对象与知识</h2><select id="entity" aria-label="选择对象"><option value="">全部对象</option></select><select id="status" aria-label="筛选核验状态"><option value="">全部状态</option><option value="source_aligned">原文对齐（未独立复核）</option><option value="verified_model">模型核验通过</option><option value="pending">待审</option><option value="rejected">已拒绝</option></select></div><p id="entityInfo"></p><div id="dossier"></div><p id="note"></p>
<div class="table-wrap"><table class="data-table"><thead><tr><th>对象 / 范围</th><th>字段与原值</th><th>来源与状态</th></tr></thead><tbody id="rows"></tbody></table></div><div class="recognition-pagination"><button id="prev" class="button ghost">上一页</button><span id="pageInfo"></span><button id="next" class="button ghost">下一页</button></div><h3>关系候选</h3><div id="relations"></div></section>
</main><script src="./navigation.js?v=20261109-ui1"></script><script src="./api.js?v=20261028"></script><script src="./knowledge-recognition.js?v=20261029-knowledge-v3"></script></body></html>
