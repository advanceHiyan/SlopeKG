<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全文知识识别 - SlopeKG</title><link rel="stylesheet" href="./pages.css?v=20261028"><link rel="stylesheet" href="./recognition.css?v=20261028"><link rel="stylesheet" href="./knowledge-recognition.css?v=20261028"></head>
<body class="portal-body"><header class="site-header"><div class="site-header-inner"><a class="site-brand" href="./index.html">SlopeKG<small>资料、对象与可追溯知识</small></a><nav class="site-nav"><a href="./pdf-ingestion.html">PDF识别工作台</a><a class="active" href="./knowledge-recognition.html">全文知识识别</a><a href="./graph.html">正式图谱</a></nav></div></header>
<main class="page-main"><div class="page-heading"><div><h1>全文知识识别</h1><p>先发现全文对象和概念，再关联分散原文，重组为对象事实与关系。与 basic、多模态分别运行。</p></div><button id="refresh" class="button secondary">刷新</button></div>
<section class="card recognition-card"><h2>选择资料与模型</h2><div class="recognition-controls"><label>模型<select id="model"></select></label><label>调用上限<input id="maxCalls" type="number" min="1" max="10000" value="500"></label><label>模型并发<input id="concurrency" type="number" min="1" max="16" value="4"></label></div>
<p id="endpoint" class="form-help"></p><input id="searchFiles" type="search" placeholder="按文件名或目录筛选" aria-label="筛选资料"><div id="files" class="recognition-files"></div>
<label class="recognition-confirm"><input id="allow" type="checkbox">允许将勾选资料的原文发送到所选模型接口</label><div class="action-row"><button id="prepare" class="button ghost" disabled>仅本地准备</button><button id="run" class="button" disabled>全文知识识别</button></div>
<p class="form-help">这条路线读取可用文字，不把无法读取的图形页当作完成。模型核验通过仍待人工确认，结果不自动进入正式图谱。</p><p id="error" class="notice error" hidden role="alert"></p></section>
<section class="card"><h2>任务与覆盖</h2><p id="job" aria-live="polite">尚未开始</p><p id="coverage"></p><div id="metrics" class="grid metrics-grid"></div></section>
<section class="card"><div class="card-title-row"><h2>对象与知识</h2><select id="entity" aria-label="选择对象"><option value="">全部对象</option></select><select id="status" aria-label="筛选核验状态"><option value="">全部状态</option><option value="verified_model">模型核验通过</option><option value="pending">待审</option><option value="rejected">已拒绝</option></select></div><p id="entityInfo"></p><p id="note"></p>
<div class="table-wrap"><table class="data-table"><thead><tr><th>对象 / 范围</th><th>字段与原值</th><th>来源与状态</th></tr></thead><tbody id="rows"></tbody></table></div><div class="recognition-pagination"><button id="prev" class="button ghost">上一页</button><span id="pageInfo"></span><button id="next" class="button ghost">下一页</button></div><h3>关系候选</h3><div id="relations"></div></section>
</main><script src="./api.js?v=20261028"></script><script src="./knowledge-recognition.js?v=20261028"></script></body></html>
