<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能识别 · SlopeKG</title><link rel="stylesheet" href="./agent-workspace.css?v=20261109-ui1"><link rel="stylesheet" href="./navigation.css?v=20261109-ui1"></head>
<body><div class="workspace evidence-hidden">
<aside class="sidebar" aria-label="智能识别任务">
<div class="workspace-label">智能识别<small>资料 · 对象 · 原文证据</small></div><button id="newTask" class="new-task">＋ 新建识别任务</button>
<div class="sidebar-label">识别记录 <button id="refresh" class="icon-button" aria-label="刷新记录">↻</button></div><nav id="history" class="history" aria-label="历史识别任务"><p class="muted">正在读取记录…</p></nav>
<div class="sidebar-bottom"><a href="./pdf-library.html">资料管理</a><a href="./recognition-debug.html">开发工具 · 识别调试</a></div></aside>
<main class="conversation"><nav class="method-nav" aria-label="识别方法"></nav><header class="task-header"><button id="toggleTasks" class="icon-button mobile-only" aria-label="切换历史任务">☰</button><div><p class="eyebrow">智能识别 · 第五路</p><h1 id="taskTitle">选择资料，开始识别</h1></div><div class="header-actions"><span id="runStatus" class="status">新任务</span><button id="toggleEvidence" class="icon-button" aria-label="切换资料面板">▤</button></div></header>
<nav class="tabs" aria-label="任务视图"><button data-tab="results">识别结果</button><button data-tab="chat">对话与进展</button><button data-tab="library">边坡资料库</button><details class="task-more"><summary>过程详情</summary><div><button data-tab="assessment">历史评估交接</button><button data-tab="trace">执行轨迹</button><button data-tab="calls">模型调用</button></div></details></nav><div id="error" class="error-banner" role="alert" hidden></div><section id="feed" class="feed"></section><div id="finishedActions" class="finished-actions" hidden><span>已保存的识别结果 · 待复核</span><button data-new-task>＋ 新建任务</button></div>
<footer class="composer-wrap" id="taskComposer"><div id="runningBar" class="running-bar" hidden><span><i class="pulse"></i> <span id="activity">正在处理资料</span></span><button id="stop" class="stop-button">■ 停止任务</button></div><div id="selectedChips" class="selected-chips"></div>
<div class="composer"><textarea id="instruction" rows="2" maxlength="20000" aria-label="本次识别要求" placeholder="填写本次识别重点，例如：按边坡和危岩体整理参数，保留原文位置…"></textarea><div class="composer-actions"><div><button id="chooseFiles" class="attach-button">＋ 资料 <span id="selectedCount"></span></button><select id="model" aria-label="识别模型"></select></div><div><button id="prepare" class="text-button" disabled>仅准备资料</button><button id="run" class="send-button" disabled aria-label="开始智能识别">开始识别 ↑</button></div></div></div><div class="composer-meta"><span>任务和结果自动保存 · 可随时停止</span><span id="usage">过程与结果自动保存</span></div></footer></main>
<aside id="evidence" class="evidence" aria-label="资料与产物"><div class="evidence-heading"><h2>资料与产物</h2><span id="pageCount" class="muted"></span><button id="closeEvidence" class="icon-button panel-close" aria-label="关闭资料面板">×</button></div><div class="side-tabs"><button id="showSources" class="active">原始资料</button><button id="showOutputs">生成文件</button></div>
<div id="sourcePanel"><label class="field-label" for="pageSelect">原页预览</label><select id="pageSelect"><option value="">选择历史任务后查看原页</option></select><div class="page-controls"><button id="pagePrev" aria-label="上一张原页">←</button><span id="pagePosition">—</span><button id="pageNext" aria-label="下一张原页">→</button></div><p id="sourceQuote" class="source-quote" hidden></p><div id="imageBox" class="image-box"><p>原图、裁图与定位信息<br>会保留在这里</p></div><a id="fullImage" class="small-link" target="_blank" rel="noopener" hidden>打开完整原图 ↗</a></div><div id="outputPanel" hidden><div id="outputFiles" class="file-list"></div></div>
<details class="storage"><summary>过程保存在哪里？</summary><p>每次任务都有独立目录，离开页面不会中断后台任务。</p><dl id="storagePaths"></dl><div id="auditLinks"></div></details><p class="evidence-note">识别结果为待核候选。点击事实的原页证据，可核对对象、数值与上下文。</p></aside></div>
<dialog id="filesDialog"><form method="dialog" class="dialog-heading"><div><h2>选择本次资料</h2><p>可多选，Agent 会自主安排阅读顺序。</p></div><button class="icon-button" aria-label="关闭资料选择">×</button></form><div class="file-search"><input id="searchFiles" type="search" placeholder="搜索文件名或目录" aria-label="筛选PDF"><button id="upload" class="secondary">上传 PDF</button><input id="uploadInput" type="file" accept=".pdf,application/pdf" multiple hidden></div><div id="files" class="pick-files"></div><p id="uploadStatus" class="muted" role="status"></p><p id="endpoint" class="muted"></p><label class="consent"><input id="allow" type="checkbox">允许将所选 PDF 的原文和页面图像发送到上述模型接口</label><div class="dialog-footer"><span id="dialogCount">已选 0 份</span><button id="confirmFiles" class="primary">使用所选资料</button></div></dialog>
<dialog id="detailDialog" class="detail-dialog"><form method="dialog" class="dialog-heading"><h2 id="detailTitle">完整记录</h2><button class="icon-button" aria-label="关闭完整记录">×</button></form><div id="detailBody"></div></dialog><script src="./navigation.js?v=20261109-ui1"></script><script src="./api.js?v=20261028"></script><script src="./agent-recognition.js?v=20261110-delivery-recovery"></script></body></html>
